name: Build fundamentals feed

on:
  schedule:
    - cron: '30 21 * * 0-4'      # 03:00 IST Mon–Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch feed
        run: python scripts/build_universe.py
      - name: Commit if changed
        run: |
          git config user.name  "portfolio-lens-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/universe.json
          git diff --staged --quiet || git commit -m "feed: refresh universe.json ($(date -u +%F))"
          git push
